<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>録画一覧 - ニコ生プレイバックレコーダー</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <h1>録画一覧</h1>
    <label class="search">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="search" type="search" placeholder="番組名・配信者で検索" aria-label="番組名・配信者で検索">
    </label>
    <div class="usage" id="usage"></div>
    <button type="button" id="refresh" class="button">更新</button>
  </header>

  <div class="layout">
    <nav class="programs" aria-label="番組">
      <div class="filters" role="group" aria-label="種類で絞り込み">
        <button type="button" class="filter" data-kind="" aria-pressed="true">すべて</button>
        <button type="button" class="filter kind-video" data-kind="video" aria-pressed="false">動画のみ</button>
        <button type="button" class="filter kind-comments" data-kind="comments" aria-pressed="false">コメント付き</button>
        <button type="button" class="filter kind-screen" data-kind="screen" aria-pressed="false">画面</button>
      </div>
      <div id="programList" class="program-list"></div>
    </nav>

    <main id="main" class="main">
      <p id="emptyState" class="empty" hidden></p>
      <section id="program" class="program" hidden>
        <div class="program-head">
          <div class="program-heading">
            <h2 id="programTitle"></h2>
            <p id="programMeta" class="meta"></p>
          </div>
          <div class="program-actions">
            <button type="button" id="downloadProgram" class="button"></button>
            <button type="button" id="deleteProgram" class="button danger">この番組の録画を削除</button>
          </div>
        </div>
        <div id="player" class="player"></div>
        <div id="lanes" class="lanes" aria-label="録った時間（クリックした時刻から再生）"></div>
        <h3 id="segmentsTitle" class="section-title">区間</h3>
        <ol id="segments" class="segments"></ol>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
